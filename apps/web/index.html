<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F1E5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141B22" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Meridian — un atlas d'expédition : plante ton camp, trace ta route."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Meridian" />
    <title>Meridian</title>
    <script src="/theme-init.js"></script>
    <style>
      /* App shell colours mirror the design tokens (paper-100, ink-900, ink-700). */
      :root {
        --shell-paper: #f7f1e5;
        --shell-ink: #24232b;
        --shell-ink-700: #45434f;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='atlas']) {
          --shell-paper: #141b22;
          --shell-ink: #e9e1cf;
          --shell-ink-700: #c7beab;
        }
      }
      :root[data-theme='nocturne'] {
        --shell-paper: #141b22;
        --shell-ink: #e9e1cf;
        --shell-ink-700: #c7beab;
      }
      html,
      body {
        margin: 0;
        background: var(--shell-paper);
        color: var(--shell-ink);
      }
      .shell {
        position: fixed;
        inset: auto 0 0 0;
        box-sizing: border-box;
        /* Same height as the launcher sheet that replaces it (no jump, AD A1). */
        min-height: min(50dvh, 420px);
        padding: 16px;
        border-top: 1px solid var(--shell-ink);
        background: var(--shell-paper);
        font-family: Georgia, 'Iowan Old Style', serif;
      }
      .shell-over {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--shell-ink-700);
      }
      .shell-title {
        margin: 4px 0 0;
        font-size: 32px;
        font-weight: 500;
      }
      @media (min-width: 900px) {
        .shell {
          inset: 24px auto auto 24px;
          min-height: 0;
          width: 340px;
          padding: 32px;
          border: 1px solid var(--shell-ink);
        }
      }
    </style>
  </head>
  <body>
    <!--
      App shell (development-plan §Phase 3, LCP ≤ 2 s): painted from the HTML alone, before any
      script or font; React replaces it on mount.
    -->
    <div id="root">
      <div class="shell" aria-hidden="true">
        <p class="shell-over">Atlas d’expédition</p>
        <p class="shell-title">Meridian</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
